{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block public_content %}
<div class="login-wrapper">
    <div class="login-card card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="login-brand mb-2"><i class="bi bi-person-workspace"></i></div>
                <h1 class="h4 mb-1">{{ nombre_estudio }}</h1>
                <p class="text-muted small mb-0">Panel de administración</p>
            </div>

            <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ request.form.get('email', '') }}"
                           autocomplete="username" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
